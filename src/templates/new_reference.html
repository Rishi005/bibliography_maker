{% extends "layout.html" %}

{% block title %}
Add a new reference
{% endblock %}

{% block body %}

<h2>Add a new reference</h2>

<form action="/create_reference" method="post">
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul>
      {% for message in messages %}
        <li>{{ message }}</li>
      {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <label for="entry_type">Reference type:</label>
  <select id="entry_type" name="entry_type">
    <option value="book" selected>Book</option>
    <!-- can add more references later -->
  </select>
  <br>

  <label for="citekey">Citation key:</label>
  <input type="text" id="citekey" name="citekey" required>
  <br>

  <label for="title">Title:</label>
  <input type="text" id="title" name="title" required>
  <br>

  <label for="author">Author:</label>
  <input type="text" id="author" name="author" required>
  <br>

  <label for="year">Year:</label>
  <input type="number" id="year" name="year" required>
  <br>

  <label for="publisher">Publisher:</label>
  <input type="text" id="publisher" name="publisher" required>
  <br>

  <button type="submit">
    Add book
  </button>

</form>

{% endblock %}
